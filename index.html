$('#sub').textContent=T('sub')(D.last_date,D.created_at,D.evals.length,D.confirm);$('#lang-en').setAttribute('aria-pressed',String(LANG==='en'));$('#lang-zh').setAttribute('aria-pressed',String(LANG==='zh'));
const tiles=[[T('t_value'),P?usd(P.value):'n/a',P?T('t_value_s')(usd(P.capital),P.n):'',1],[T('t_ret'),P?pct(P.ret,2):'n/a',P?T('t_ret_s')(pct(P.spy_ret,2)):''],[T('t_vs'),P?pct(P.ret-P.spy_ret,2):'n/a',T('t_vs_s')],
[T('t_beat'),P?`${P.beat_spy} / ${P.n}`:'n/a',P?T('t_beat_s')(P.winners):''],[T('t_dd'),P?pct(P.max_drawdown,1):'n/a',T('t_dd_s')],[T('t_mis'),String(D.counts.mistakes),T('t_mis_s')],[T('t_over'),String(D.counts.overstated),T('t_over_s')]];
$('#tiles').replaceChildren(...tiles.map(([l,v,s,h])=>el('div',{class:'tile'+(h?' hero':'')},el('div',{class:'l',text:l}),el('div',{class:'v',text:v}),el('div',{class:'s',text:s}))))}
function curve(){const box=$('#curve');box.replaceChildren();$('#curveTable').replaceChildren();if(!P)return;const c=P.curve,W=Math.max(520,box.clientWidth||900),H=260,m={l:70,r:16,t:10,b:26};const vals=c.flatMap(x=>[x.portfolio,x.spy]);let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*.1||10000;lo-=pad;hi+=pad;
const X=i=>m.l+(c.length<2?0:i*(W-m.l-m.r)/(c.length-1)),Y=v=>m.t+(hi-v)*(H-m.t-m.b)/(hi-lo);const s=sv('svg',{width:W,height:H,role:'img','aria-label':T('h_curve')});
for(let k=0;k<5;k++){const v=lo+k*(hi-lo)/4;s.append(sv('line',{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:'var(--grid)'}));const t=sv('text',{x:m.l-6,y:Y(v)+4,'text-anchor':'end'});t.textContent='$'+(v/1e6).toFixed(3)+'M';s.append(t)}
s.append(sv('line',{x1:m.l,x2:W-m.r,y1:Y(P.capital),y2:Y(P.capital),stroke:'var(--text-muted)','stroke-dasharray':'3 3'}));
[['spy','var(--series-2)'],['portfolio','var(--series-1)']].forEach(([k,col])=>s.append(sv('path',{d:c.map((x,i)=>(i?'L':'M')+X(i)+' '+Y(x[k])).join(''),fill:'none',stroke:col,'stroke-width':2,'stroke-linejoin':'round'})));
[0,c.length-1].forEach(i=>{const t=sv('text',{x:X(i),y:H-8,'text-anchor':i?'end':'start'});t.textContent=c[i].d;s.append(t)});
const hl=sv('line',{y1:m.t,y2:H-m.b,stroke:'var(--text-muted)',visibility:'hidden'});s.append(hl);const hit=sv('rect',{x:m.l,y:0,width:W-m.l-m.r,height:H,fill:'transparent'});s.append(hit);
hit.addEventListener('pointermove',ev=>{const r=s.getBoundingClientRect(),i=Math.max(0,Math.min(c.length-1,Math.round((ev.clientX-r.left-m.l)/((W-m.l-m.r)/Math.max(1,c.length-1)))));hl.setAttribute('x1',X(i));hl.setAttribute('x2',X(i));hl.setAttribute('visibility','visible');
showTip(ev,[[c[i].d,'',null],[usd(c[i].portfolio),T('tip_pf')+' '+pct(c[i].portfolio/P.capital-1,2),'var(--series-1)'],[usd(c[i].spy),'SPY '+pct(c[i].spy/P.capital-1,2),'var(--series-2)']])});
hit.addEventListener('pointerleave',()=>{hide();hl.setAttribute('visibility','hidden')});box.append(s);
$('#curveTable').append(TB([T('cols_pos')[1],T('t_value'),'SPY'],c.map(x=>el('tr',{},el('td',{text:x.d}),el('td',{class:'n',text:usd(x.portfolio)}),el('td',{class:'n',text:usd(x.spy)})))))}
function bars(){const box=$('#bars');box.replaceChildren();const r=D.evals.filter(e=>e.excess!=null).sort((a,b)=>b.excess-a.excess);const W=Math.max(520,box.clientWidth||900),rh=20,H=r.length*rh+20,m=90,mid=m+(W-m-60)/2;
const mx=Math.max(.05,...r.map(e=>Math.abs(e.excess)));const sc=v=>v*(W-m-60)/2/mx;const s=sv('svg',{width:W,height:H,role:'img','aria-label':T('h_bars')});
s.append(sv('line',{x1:mid,x2:mid,y1:0,y2:H-14,stroke:'var(--text-muted)'}));r.forEach((e,i)=>{const y=i*rh+4,w=sc(e.excess);const t=sv('text',{x:m-6,y:y+12,'text-anchor':'end'});t.textContent=e.ticker+(e.verdict==='no_buy'?T('no'):'');s.append(t);
s.append(sv('rect',{x:w>=0?mid:mid+w,y:y,width:Math.max(1,Math.abs(w)),height:rh-6,rx:3,fill:w>=0?'var(--div-pos)':'var(--div-neg)',opacity:e.verdict==='no_buy'?.45:1}));
const v=sv('text',{x:w>=0?mid+w+4:mid+w-4,y:y+12,'text-anchor':w>=0?'start':'end'});v.textContent=pct(e.excess);s.append(v);
const h=sv('rect',{x:m,y:y-2,width:W-m,height:rh,fill:'transparent'});h.addEventListener('pointermove',ev=>showTip(ev,[[pct(e.excess),T('t_vs')+' · '+e.ticker,null],[pct(e.ret),T('tip_stock'),null],[pct(e.spy_ret),'SPY',null],[M('L',e.label),M('S',e.status)+' · '+e.sessions+' '+T('sessions'),null]]));h.addEventListener('pointerleave',hide);s.append(h)});
const n=el('div',{text:T('bars_note')});n.style.cssText='color:var(--text-muted);font-size:12px';box.append(s,n)}
const BADGE={FALSE_POSITIVE:['b-crit','✖'],DRAWDOWN_UNDERSTATED:['b-ser','▼'],RISK_OVERSTATED:['b-warn','◆'],MISSED_WINNER:['b-warn','◆'],ON_TRACK:['b-good','✔'],CORRECT_REJECT:['b-good','✔'],NEUTRAL:['','·']};
let F='issues';function filters(){$('#filters').replaceChildren(...[['issues','f_issues'],['mist','f_mist'],['over','f_over'],['all','f_all']].map(([k,l])=>{const b=el('button',{'aria-pressed':String(k===F),text:T(l)});b.onclick=()=>{F=k;filters();fb()};return b}))}
function fb(){const box=$('#fb');box.replaceChildren();const issues=e=>['FALSE_POSITIVE','DRAWDOWN_UNDERSTATED','RISK_OVERSTATED','MISSED_WINNER'].includes(e.label);
const rows=D.evals.filter(e=>e.label&&e.sessions!=null&&(F==='all'||issues(e)&&(F==='issues'||(F==='mist'?['FALSE_POSITIVE','DRAWDOWN_UNDERSTATED']:['RISK_OVERSTATED','MISSED_WINNER']).includes(e.label))));
const zh=LANG==='zh';box.append(rows.length?TB(T('cols_fb'),rows.map(e=>{const[c,ic]=BADGE[e.label]||['','·'];const ul=el('ul',{class:'why'});const w=(zh?e.why_zh:e.why)||[];(w.length?w:[T('noise')]).forEach(x=>ul.append(el('li',{text:x})));
const fh=zh?e.fix_hint_zh:e.fix_hint;if(fh)ul.append(el('li',{text:T('fix')+fh}));
return el('tr',{},el('td',{text:e.ticker}),el('td',{text:M('V',e.verdict)+' · '+M('G',e.group)}),el('td',{},el('span',{class:'badge '+c,'data-icon':ic,text:zh?M('L',e.label):e.label.replace(/_/g,' ').toLowerCase()})),el('td',{text:M('S',e.status)+' ('+e.sessions+')'}),el('td',{class:'n',text:pct(e.ret)}),el('td',{class:'n',text:pct(e.excess)}),el('td',{text:e.cause?M('C',e.cause):'-'}),el('td',{},ul))})):el('div',{class:'sub',text:T('none_view')}))}
function props(){const b=$('#props');const zh=LANG==='zh';b.replaceChildren(el('div',{class:'sub',text:T('props_note')(D.min_pattern)}),TB(T('cols_props'),[...D.loop.proposals,...D.loop.watching].map(p=>el('tr',{},el('td',{text:p.id||(M('L',p.label)+' / '+M('C',p.cause))}),el('td',{text:M('S',p.state)}),el('td',{text:(p.confirmed||[]).join(', ')||'-'}),el('td',{text:(p.provisional||[]).join(', ')||'-'}),el('td',{text:(zh?p.fix_hint_zh:p.fix_hint)||p.fix_hint})))))}
function roles(){$('#roles').replaceChildren(el('div',{class:'sub',text:T('roles_note')}),TB(T('cols_roles'),Object.entries(D.loop.roles).map(([k,x])=>el('tr',{},el('td',{text:M('R',k)}),...['dissent_right','dissent_wrong','favour_right','favour_wrong'].map(f=>el('td',{class:'n',text:String(x[f])}))))))}
function pos(){$('#pos').replaceChildren();if(!P)return;$('#pos').append(TB(T('cols_pos'),P.positions.map(p=>el('tr',{},el('td',{text:p.ticker}),el('td',{text:p.buy_date}),el('td',{class:'n',text:p.buy_price.toFixed(2)}),el('td',{class:'n',text:p.last_price.toFixed(2)}),el('td',{class:'n',text:p.shares.toFixed(1)}),el('td',{class:'n',text:usd(p.value)}),el('td',{class:'n',text:usd(p.pnl)}),el('td',{class:'n',text:pct(p.ret)}),el('td',{class:'n',text:pct(p.excess)})))))}
function render(){header();curve();bars();filters();fb();props();roles();pos()}
[['en','#lang-en'],['zh','#lang-zh']].forEach(([l,s])=>$(s).onclick=()=>{LANG=l;localStorage.setItem('dash_lang',l);history.replaceState(null,'','?lang='+l);render()});
render();</script></body></html>
