function curve(){const box=$('#curve');box.replaceChildren();$('#curveTable').replaceChildren();if(!P)return;const c=P.curve,W=Math.max(320,box.clientWidth||900),H=260,m={l:70,r:16,t:10,b:26};const vals=c.flatMap(x=>[x.portfolio,x.spy,x.invested||P.capital]);let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*.1||10000;lo-=pad;hi+=pad;
const X=i=>m.l+(c.length<2?0:i*(W-m.l-m.r)/(c.length-1)),Y=v=>m.t+(hi-v)*(H-m.t-m.b)/(hi-lo);const s=sv('svg',{width:W,height:H,role:'img','aria-label':T('h_curve')});

function bars(){const box=$('#bars');box.replaceChildren();const r=D.evals.filter(e=>e.excess!=null).sort((a,b)=>b.excess-a.excess);const W=Math.max(320,box.clientWidth||900),rh=20,H=r.length*rh+20,m=90,mid=m+(W-m-60)/2;
const mx=Math.max(.05,...r.map(e=>Math.abs(e.excess)));const sc=v=>v*(W-m-60)/2/mx;const s=sv('svg',{width:W,height:H,role:'img','aria-label':T('h_bars')});

const BADGE={FALSE_POSITIVE:['b-crit','✖'],DRAWDOWN_UNDERSTATED:['b-ser','▼'],RISK_OVERSTATED:['b-warn','◆'],MISSED_WINNER:['b-warn','◆'],ON_TRACK:['b-good','✔'],CORRECT_REJECT:['b-good','✔'],NEUTRAL:['','·']};
